# .github/workflows/ios-build.yml
#
# Compiles the iOS app for the Simulator on every push to main and on PRs
# that touch Swift code or the Xcode project. macOS runners are billed at
# 10× the rate of Linux runners, so we keep the trigger narrow.
#
# This catches: missing files in project.pbxproj, Swift compile errors,
# broken SPM dependencies, and resource issues. It does NOT run UI tests
# or unit tests yet (see TODO at bottom).
name: ios build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | head -20

      # CI doesn't have the gitignored SupabaseConfig.swift. Generate a stub
      # with the local-default URL/anon-key so the project compiles. This
      # never connects to a real backend during build.
      - name: Stub SupabaseConfig.swift
        run: |
          cat > ios/Tempo/Supabase/SupabaseConfig.swift <<'EOF'
          import Foundation
          enum SupabaseConfig {
              static let url: URL        = URL(string: "http://127.0.0.1:54321")!
              static let anonKey: String = "ci_stub_key"
          }
          EOF

      - name: Build for Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Tempo.xcodeproj \
            -scheme Tempo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions || \
          xcodebuild \
            -project Tempo.xcodeproj \
            -scheme Tempo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

# TODO: add a `test` job once we have XCTest targets. The Tempo.xcodeproj
# currently has no test target; adding one is a separate piece of work.
