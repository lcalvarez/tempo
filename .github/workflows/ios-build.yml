# .github/workflows/ios-build.yml
#
# Compiles the iOS app for the Simulator on every push to main and on PRs
# that touch Swift code or the Xcode project. macOS runners are billed at
# 10× the rate of Linux runners, so we keep the trigger narrow.
#
# This catches: missing files in project.pbxproj, Swift compile errors,
# broken SPM dependencies, and resource issues. It does NOT run UI tests
# or unit tests yet (see TODO at bottom).
name: ios build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    # macos-26 ships Xcode 26.x, matching the dev Mac. macos-15 lagged on
    # Xcode 16.x which fails to compile our Swift 6 / SDK 26 surface.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          # Use whatever Xcode the runner ships with; pinning a specific
          # path (Xcode_16.app) breaks every time GitHub rotates images.
          # If we ever need to pin, switch to:
          #   sudo xcode-select -s /Applications/Xcode_26.app
          xcodebuild -version
          xcrun simctl list runtimes | head -20

      # CI doesn't have the gitignored SupabaseConfig.swift. Generate a
      # stub with the same shape the bootstrap script writes — the new
      # generated config has a `useLocal` flag and separate
      # local/cloud URL/key constants. The simpler "single static let
      # url" form would still compile (the rest of the app only reads
      # `SupabaseConfig.url` and `SupabaseConfig.anonKey`), but matching
      # the real shape avoids a surprise the next time someone adds a
      # private constant to the bootstrapped file.
      - name: Stub SupabaseConfig.swift
        run: |
          cat > ios/Tempo/Supabase/SupabaseConfig.swift <<'EOF'
          // CI stub — matches the shape of bootstrap-supabase.sh's output.
          import Foundation

          enum SupabaseConfig {
              static var url: URL {
                  #if DEBUG
                  return useLocal ? localURL : cloudURL
                  #else
                  return cloudURL
                  #endif
              }

              static var anonKey: String {
                  #if DEBUG
                  return useLocal ? localAnonKey : cloudAnonKey
                  #else
                  return cloudAnonKey
                  #endif
              }

              private static let useLocal: Bool = true
              private static let localURL    = URL(string: "http://127.0.0.1:54321")!
              private static let localAnonKey = "ci_stub_local_key"
              private static let cloudURL    = URL(string: "https://example.supabase.co")!
              private static let cloudAnonKey = "ci_stub_cloud_key"
          }
          EOF

      - name: Build for Simulator
        working-directory: ios
        run: |
          set -o pipefail
          # Run twice: first piped through xcbeautify for readable
          # GitHub Actions annotations, falling back to raw xcodebuild
          # output if xcbeautify isn't available on the runner image.
          # The actual *build* arguments must match between the two
          # invocations; if you change one, change both.
          XCODEBUILD_ARGS=(
            -project Tempo.xcodeproj
            -scheme Tempo
            -configuration Debug
            -destination 'generic/platform=iOS Simulator'
            -derivedDataPath build
            CODE_SIGN_IDENTITY=""
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGNING_ALLOWED=NO
            build
          )
          if command -v xcbeautify >/dev/null 2>&1; then
            xcodebuild "${XCODEBUILD_ARGS[@]}" | xcbeautify --renderer github-actions
          else
            xcodebuild "${XCODEBUILD_ARGS[@]}"
          fi

# TODO: add a `test` job once we have XCTest targets. The Tempo.xcodeproj
# currently has no test target; adding one is a separate piece of work.
